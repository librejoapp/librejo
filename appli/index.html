<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Politique de sécurité : seuls les scripts du site s'exécutent (jamais du code écrit dans la page ou venu du dossier) ;
     la liste des Cerfa et les PDF officiels sont les seules lectures hors du site. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob: https://raw.githubusercontent.com https://*.service-public.fr https://*.gouv.fr; worker-src 'self' blob:; frame-src 'self' blob: data:; object-src 'self' blob:; base-uri 'none'; form-action 'none'">
<title>Librejo</title>
<meta name="theme-color" content="#1F6F6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="boot.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app/polices.css">
<style>
/* ==========================================================================
   Librejo — feuille de styles unique
   Ordre : 1. variables  2. base  3. mise en page  4. composants  5. écrans
   Règles : toujours passer par les variables (couleurs, tailles, espacements,
   arrondis, ombres) ; pas de style écrit dans le code JavaScript ; une classe
   par rôle. Référence : DESIGN.txt, à côté de Librejo.html.
   ========================================================================== */

/* ---------- 1. Variables ---------- */
:root{
  color-scheme:light;
  /* Couleurs de la charte Librejo (bleu canard, ambre, encre, crème) */
  --navy:#174f4c;            /* canard foncé : menu, titres */
  --blue:#1F6F6B;            /* bleu canard : liens, sélection */
  --accent:#E9A23B;          /* ambre : actions principales, repères */
  --accent-ink:#2b1d05;      /* texte sur fond --accent plein, et nulle part ailleurs */
  --accent-soft:#fcf1dc;     /* fond ambré léger */
  --accent-text:#8a5a0b;     /* texte ambré lisible sur fond clair */
  --accent-on-dark:#f2c26b;  /* ambre lisible sur le canard foncé */
  --accent-line:#b67e2e;     /* ambre des repères non textuels (choix, bordures d'état, barres) : ≥ 3:1 sur la crème */
  --on-color:#ffffff;        /* texte et pictogrammes posés sur un fond coloré (bouton plein, menu sombre) */
  /* Contour de focus clavier : bleu canard nuit sur les fonds clairs (≥ 7:1 sur le blanc, ≥ 6:1 sur la crème) ;
     l'ambre seul n'y fait que 2:1. Sur les fonds sombres (menu sombre, pastilles foncées), --focus passe à l'ambre lisible. */
  --focus:var(--navy);

  /* Texte */
  --text:#17302F;
  --text-2:#263d3b;          /* libellés, texte appuyé */
  --text-3:#46595a;          /* texte secondaire */
  --text-muted:#5b6b6a;      /* indications, pied de page */
  --text-on-dark:#d5dfdf;    /* menu sombre : texte normal (recalculé avec la couleur du menu) */
  --text-on-dark-2:#bececd;  /* menu sombre : compteurs, intitulés (≥ 4,6:1 sur le menu et son survol) */
  --menu-muted:#5b6b6a;      /* menu clair : intitulés et compteurs (recalculé sur le fond du menu) */

  /* Surfaces et traits */
  --bg:#f7f4ec;              /* fond de page */
  --surface:#ffffff;         /* cartes, champs */
  --surface-2:#f0ece2;       /* survol, fonds discrets */
  --surface-3:#faf8f3;       /* en-têtes de tableau, encarts */
  --line:#ece5d8;            /* bordures de cartes */
  --line-soft:#efeae0;       /* séparateurs de lignes */
  --line-strong:#d2cbbb;     /* bordures de champs et boutons */
  --line-dashed:#c2baa8;

  /* États */
  --ok:#178a47; --ok-text:#157a3f; --ok-bg:#e3f4ea; --ok-on-dark:#9fe0b8;
  --warn:#b0480c; --warn-bg:#fdefe2; --warn-line:#f1c8a4;
  --danger:#c2410c; --danger-icon:#c0392b; --danger-text:#9c3209; --danger-bg:#fbe9e2;
  --highlight:#ffe08a;

  /* Typographie : 7 tailles, plus une réservée aux pictogrammes de type de fichier.
     En rem : elles suivent la taille de police choisie dans le navigateur (16 px par défaut, même rendu qu'avant). */
  --f-body:"Asap", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-1:.75rem; --fs-2:.8125rem; --fs-3:.875rem; --fs-4:1rem; --fs-5:1.125rem; --fs-6:1.375rem; --fs-7:1.625rem;
  --fs-micro:.625rem;  /* 10 px : seulement pour un repère décoratif doublé d'un texte accessible (type de fichier) */

  /* Espacements */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:40px;

  /* Arrondis */
  --r-sm:8px; --r-md:14px; --r-lg:18px; --r-full:999px;

  /* Ombres et voiles : toujours chauds (brun doré), jamais gris ni colorés */
  --shadow-soft:0 1px 3px rgba(90,60,20,.12);              /* petit relief : choix actif, pastille */
  --shadow-sheet:0 1px 4px rgba(90,60,20,.16);             /* page de document posée */
  --shadow-card:0 1px 2px rgba(90,60,20,.05),0 6px 20px rgba(90,60,20,.07);
  --shadow-raised:0 10px 24px rgba(90,60,20,.12);
  --shadow-pop:0 18px 40px -14px rgba(70,45,12,.38);       /* fenêtres, volets, bulles */
  --scrim:rgba(46,34,16,.45);                              /* voile sous une fenêtre */
  --scrim-strong:rgba(46,34,16,.74);                       /* voile de l'aperçu d'un PDF */

  /* Dimensions */
  --h-control:40px;  /* boutons */
  --h-input:48px;    /* champs */
  --sbw:16rem;       /* largeur du menu : 256 px, et le double quand le navigateur agrandit le texte à 200 % */
  --w-content:1200px;
  --w-form:860px;    /* formulaires */
  --w-wide:980px;    /* réglages */
}

/* ---------- 2. Base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:var(--fs-4);line-height:1.5}
img{max-width:100%}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:is(button,input,select,textarea,a,summary,label.secondary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* fonds sombres : l'ambre reste (≥ 4,6:1 sur la couleur du menu, recalculé avec les couleurs de la structure) */
html:not(.menu-clair) .sidebar,.rchip,.toast{--focus:var(--accent-on-dark)}
/* boutons dans un groupe qui rogne ses bords (overflow:hidden) : contour à l'intérieur, blanc sur le bouton choisi */
:is(.seg,.viewtoggle) button:focus-visible{outline-offset:-4px}
:is(.seg,.viewtoggle) button[aria-pressed="true"]:focus-visible{outline-color:var(--on-color)}
.seg.metha button[aria-pressed="true"]:focus-visible{outline-color:var(--accent-ink)}
mark{background:var(--highlight);color:inherit;padding:0 1px}
/* mouvement réduit : une seule règle pour toute l'application */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

h2.sec{margin:0;font-weight:700;font-size:var(--fs-7);line-height:1.15;letter-spacing:-.01em;color:var(--navy);text-wrap:balance}
h2.sec .o{color:var(--blue);font-weight:600}
.lab{margin:0 0 var(--sp-3);font-weight:700;font-size:var(--fs-6);color:var(--navy)}
.hint{margin:0;color:var(--text-3);font-size:var(--fs-3)}
.muted,.hint.muted{color:var(--text-muted)}
.hint.pad{padding:var(--sp-3) var(--sp-4)}
.reqnote{margin:0;color:var(--text-3);font-size:var(--fs-3)}
.warn-text{color:var(--warn);font-weight:700}
.ink{color:var(--text)}

/* Utilitaires de mise en page (pas de couleurs ici) */
.row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:grid;gap:var(--sp-3)}
.stack.s{gap:var(--sp-2)} .stack.xs{gap:var(--sp-1)}
.stack.scroll{max-height:320px;overflow:auto}
.gap-s{gap:var(--sp-2)!important} .gap-xs{gap:var(--sp-1)!important}
.grow{flex:1}
.push{margin-top:auto}
.self-end{align-self:end} .self-start{justify-self:start}
.m-0{margin:0!important}
.mt-s{margin-top:var(--sp-2)} .mt-m{margin-top:var(--sp-4)}
.right{text-align:right}
.nowrap{white-space:nowrap}
.h-input{height:var(--h-input)}
.w-form{max-width:var(--w-form)}
.w-wide{max-width:var(--w-wide)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.grid2.top{align-items:start}
.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
.fieldgrid .wide{grid-column:1/-1}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}   /* texte pour les lecteurs d'écran seulement */

/* ---------- 3. Mise en page ---------- */
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sbw);background:var(--navy);color:var(--on-color);display:flex;flex-direction:column;padding:20px 14px 16px;overflow-y:auto;z-index:5} /* au-dessus du bandeau fixe du haut (z-index 4), qui s'étend jusqu'à lui */
.sidebar .brand{display:flex;align-items:center;gap:var(--sp-3);padding:2px var(--sp-2) 22px}

/* Navigation et catégories du menu */
.sidebar nav.top{display:flex;flex-direction:column;gap:2px}
.sidebar nav.top button,.catbtn{width:100%;overflow-wrap:anywhere;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:transparent;color:var(--text-on-dark);padding:10px var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-4);font-weight:600}
.sidebar nav.top button svg,.catbtn svg{width:1.1875rem;height:1.1875rem;flex:0 0 auto;opacity:.85}
.sidebar nav.top button:hover,.catbtn:hover{background:rgba(255,255,255,.07);color:var(--on-color)}
.sidebar nav.top button[aria-current="page"],.catbtn[aria-pressed="true"]{background:rgba(255,255,255,.11);color:var(--on-color)}
.sidecats{margin-top:22px;display:flex;flex-direction:column;gap:1px}
.sidelab{font-size:var(--fs-1);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-on-dark-2);padding:0 var(--sp-3) var(--sp-2)}
.catbtn{position:relative;font-size:var(--fs-3);font-weight:500;padding:var(--sp-2) var(--sp-3)}   /* relative : le texte masqué (.sr) reste dans le menu qui défile */
.catbtn .name{flex:1;line-height:1.25}
.catbtn[aria-pressed="true"] .name{font-weight:600}
.catbtn .count{color:var(--text-on-dark-2);font-size:var(--fs-1);font-weight:600}
.catbtn.sub{position:relative;padding:6px var(--sp-3) 6px 42px;color:var(--text-on-dark)}
.catbtn.sub::before{content:"";position:absolute;left:21px;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.18)}
.catbtn.droptarget,.catbtn.over{outline:2px dashed var(--accent-line);outline-offset:-2px}
.catbtn[aria-pressed="true"] .count{color:inherit}

/* Pied du menu : état du dossier et accès admin */
.sidefoot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:var(--sp-2)}
.conn,.adminbtn{width:100%;display:flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--text-on-dark);border-radius:var(--r-sm);padding:9px var(--sp-3);font-size:var(--fs-3);font-weight:600}
.conn svg,.adminbtn svg{width:17px;height:17px;flex:0 0 auto}
.conn:hover,.adminbtn:hover{background:rgba(255,255,255,.07)}
.conn.ok{border-color:color-mix(in srgb,var(--ok-on-dark) 45%,transparent);color:var(--ok-on-dark)}
.conn.status{border-color:transparent;background:transparent;padding:var(--sp-1) var(--sp-3);font-size:var(--fs-2);cursor:default}
.conn.status svg{width:15px;height:15px}
.adminbtn.on{border:1.5px solid var(--accent);color:var(--accent-on-dark)}
.adminbtn.on:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.sidenote{font-size:var(--fs-1);color:var(--text-on-dark-2);padding:var(--sp-1) var(--sp-1) 0;text-align:center}

/* Zone de contenu */
.content{margin-left:var(--sbw);padding:30px var(--sp-7) var(--sp-5);max-width:var(--w-content)}
@media (min-width:1500px){ .content{margin-left:calc(var(--sbw) + (100vw - var(--sbw) - var(--w-content))/2)} }
main{min-height:calc(100vh - 110px)}
.panel{display:grid;gap:var(--sp-4)}
.panel.deliv{max-width:var(--w-form);padding-bottom:var(--sp-7)}
footer{display:flex;justify-content:center;gap:10px;color:var(--text-muted);font-size:var(--fs-2);padding:var(--sp-5) 0 0}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin:var(--sp-2) 0 var(--sp-3)}
#p-docs .listhead+.row{margin:-6px 0 var(--sp-3);gap:var(--sp-3)}

@media (max-width:900px){
  .sidebar{position:static;width:auto;padding:var(--sp-3)}
  .sidebar .brand{padding-bottom:var(--sp-3)}
  .sidebar nav.top{flex-direction:row;flex-wrap:wrap}
  .sidebar nav.top button{width:auto}
  .sidecats{flex-direction:row;overflow-x:auto;margin-top:10px}
  .sidelab,.sidenote{display:none}
  .catbtn{width:auto;white-space:nowrap}
  .sidefoot{flex-direction:row;flex-wrap:wrap}
  .conn,.adminbtn{width:auto}
  .content{margin-left:0;padding:20px var(--sp-4)}
}

/* ---------- 4. Composants ---------- */

/* Boutons
   .primary        action principale (orange) — une seule par zone
   .primary.alt    action forte non orange (marine) : confirmer, entrer
   .primary.danger confirmation d'une suppression
   .primary.big    pleine largeur (bas de formulaire)
   .primary.sm     dans un tableau ou une carte
   .secondary      action d'appoint ; .secondary.wide : pleine largeur en pointillés
   .ghost          action discrète ; .ghost.danger : effacer, supprimer
   .iconbtn        bouton icône seul (toujours avec aria-label)                */
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--h-control);padding:0 var(--sp-4);border-radius:var(--r-md);font-weight:700;text-decoration:none;transition:background-color .12s,filter .12s}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-size:var(--fs-4)}
.primary:hover:not(:disabled){filter:brightness(.94)}
.primary:active:not(:disabled){filter:brightness(.88)}
.primary.alt{background:var(--navy);color:var(--on-color)}
.primary.alt:hover:not(:disabled){filter:brightness(1.25)}
.primary.danger{background:var(--danger);color:var(--on-color)}
.primary.big{width:100%;min-height:52px;font-size:var(--fs-5)}
.primary.sm{min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-3)}
.secondary{border:1px solid var(--line-strong);background:var(--surface);color:var(--navy);font-size:var(--fs-3)}
.secondary:hover:not(:disabled){background:var(--surface-2)}
.secondary.wide{width:100%;border-style:dashed;border-color:var(--line-dashed)}
label.secondary{cursor:pointer}
.primary svg,.secondary svg{width:18px;height:18px;flex:0 0 auto}
.ghost{display:inline-flex;align-items:center;gap:var(--sp-1);border:0;background:transparent;color:var(--blue);font-weight:700;font-size:var(--fs-3);padding:6px var(--sp-1)}
.ghost:hover:not(:disabled){text-decoration:underline}
.ghost svg{width:18px;height:18px;flex:0 0 auto}
.ghost.danger{color:var(--text-2)}
.ghost.danger svg{color:var(--danger-icon)}
.iconbtn{width:var(--h-control);height:var(--h-control);display:inline-grid;place-items:center;padding:0;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text-3);text-decoration:none;vertical-align:middle}
.iconbtn:hover{background:var(--surface-2);color:var(--navy)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.small{width:28px;height:28px}
.iconbtn.small svg{width:15px;height:15px}
.iconbtn.align-input{margin-top:20px}
.backlink{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--blue);font-weight:700;font-size:var(--fs-3);padding:var(--sp-1) 0}
.backlink svg{width:18px;height:18px}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--blue);font:inherit;font-weight:600;text-align:left;overflow-wrap:anywhere}
.linkbtn:hover{text-decoration:underline}

/* Pastilles de choix (destinataire, molécule…) : aria-pressed="true" = choisie */
.chip{flex:0 1 auto;max-width:100%;min-height:36px;border:1px solid var(--line-strong);border-radius:var(--r-full);background:var(--surface);color:var(--text);padding:var(--sp-1) var(--sp-3);font-weight:700;font-size:var(--fs-3);overflow-wrap:anywhere}
.chip:hover{border-color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-color)}
.chip.other{border-style:dashed}
.chip.small{min-height:26px;padding:0 10px;font-size:var(--fs-2);word-break:break-all}
.choice,.dest-chips{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.choice.bad .chip,.dest-chips.bad .chip{border-color:var(--warn);background:var(--warn-bg)}

/* Choix à deux ou trois boutons collés (M./Mme, Méthadone/Buprénorphine) */
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-width:0;min-height:44px;border:0;background:transparent;padding:0 6px;font-weight:700;font-size:var(--fs-4);color:var(--text)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-color)}
.seg.metha button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.bad{border-color:var(--warn)}

/* Compteur − / + */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface-2);width:38px;height:var(--h-control);font-size:var(--fs-5);font-weight:700;color:var(--navy)}
.stepper button:hover{background:var(--line)}
.stepper input{width:64px;height:var(--h-control);border:0!important;border-radius:0!important;box-shadow:none!important;text-align:center;font-weight:700;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{display:none}

/* Bascule Liste / Vignettes */
.viewtoggle{display:flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.viewtoggle button{border:0;background:transparent;color:var(--text-3);padding:6px 11px;font-weight:700;font-size:var(--fs-3);display:inline-flex;align-items:center;gap:6px}
.viewtoggle button svg{width:16px;height:16px}
.viewtoggle button[aria-pressed="true"]{background:var(--navy);color:var(--on-color)}

/* Champs */
.field{display:grid;gap:var(--sp-1);min-width:0}
.field>span,.lbl{font-size:var(--fs-1);letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);font-weight:700}
.field>span small,.lbl small,.mini-lbl small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-muted);font-size:var(--fs-1)}
.mini-lbl{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
input.in,select.in,textarea.in{width:100%;min-width:0;height:var(--h-input);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--text);font:inherit;font-size:var(--fs-4);padding:0 var(--sp-3)}
textarea.in{height:auto;min-height:70px;padding:10px var(--sp-3);line-height:1.4}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text) 50%),linear-gradient(135deg,var(--text) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
/* focus d'un champ : contour plein de 2 px en bleu canard nuit (≥ 7:1 sur le blanc et la crème), à la souris comme au clavier */
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
input.in.bad,select.in.bad,textarea.in.bad{border-color:var(--warn);background:var(--warn-bg)}
input.num{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
input.in.w-num{width:84px}
.check{display:inline-flex;align-items:center;gap:var(--sp-2);font-weight:600}
.check.plain{font-weight:400}
.check.nowrap{white-space:nowrap}

/* Grande barre de recherche */
.bigsearch{position:relative;margin:0 0 var(--sp-5)}
.bigsearch svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;color:var(--text-3)}
.bigsearch input{height:54px;padding-left:52px;font-size:var(--fs-5);font-weight:500;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
.bigsearch input:focus{border-color:var(--focus)}
/* Numéro de version, tout petit, sous « Accès admin » */
/* bandeau « formulaires seulement » au-dessus : la teinte du titre ne remonte pas dessus */
body:has(#sdbar) .panel>.stickhead:first-child,body:has(#sdbar) .panel>.bigsearch:first-child{border-image-outset:0 100vmax}
#sdbar{position:relative;z-index:5}
.ad-sim{display:flex;flex-direction:column;gap:6px;padding:var(--sp-3);border:1px solid var(--accent-line);border-left:4px solid var(--accent);border-radius:10px;background:var(--accent-soft);margin-bottom:var(--sp-2)}
.ad-sim small{color:var(--text-3)}
.bigcat{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-3);border:1px dashed var(--accent-line);border-radius:10px;background:var(--accent-soft);margin:0 0 var(--sp-3)}
.bigcat span{flex:1 1 320px}
.cg-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:var(--sp-4);align-items:start}
@media (max-width:1100px){ .cg-wrap{grid-template-columns:1fr} }
.cg-cal,.cg-side{display:flex;flex-direction:column;gap:var(--sp-3)}
.cg-dot{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px;flex:none}
.cg-type[aria-pressed=true]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.cg-nav{display:flex;align-items:center;justify-content:space-between}
.cg-months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-5);user-select:none;touch-action:none}
@media (max-width:700px){ .cg-months{grid-template-columns:1fr} }
.cg-month h4{margin:0 0 var(--sp-2);text-transform:capitalize;color:var(--navy);font-size:var(--fs-4)}
.cg-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cg-wd{text-align:center;font-size:var(--fs-1);font-weight:700;color:var(--text-3);padding-bottom:2px}
.cg-day{aspect-ratio:1/1;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.cg-day:hover{border-color:var(--navy)}
.cg-day.off{background:var(--bg);color:var(--text-3);font-weight:400}
.cg-day.fer{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 4px,var(--line) 4px,var(--line) 5px);color:var(--text-3)}
.cg-day.today{outline:2px solid var(--navy);outline-offset:1px}
.cg-day.sel{background:var(--c);border-color:var(--c);color:#fff}
.cg-day.sel.off,.cg-day.sel.fer{background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--text-3);border-color:color-mix(in srgb,var(--c) 45%,var(--surface))}
.cg-legend{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin:0;font-size:var(--fs-2);color:var(--text-3);align-items:center}
.cg-l{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);margin-right:5px;vertical-align:-2px;background:var(--bg)}
.cg-l.fer{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 3px,var(--line) 3px,var(--line) 4px)}
.cg-table{width:100%;border-collapse:collapse;font-size:var(--fs-3)}
.cg-table th{text-align:left;font-size:var(--fs-1);text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);padding:4px 6px;border-bottom:1px solid var(--line-strong)}
.cg-table td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.cg-table small{display:block;color:var(--text-3);font-size:var(--fs-1)}
.cg-table .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cg-table tfoot td{border-bottom:0;padding:5px 6px}
.cg-table .cg-tot td{border-top:2px solid var(--navy);font-weight:700;color:var(--navy);font-size:var(--fs-4)}
.cg-warn{margin:0;padding:var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-5);border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:var(--fs-2)}
.dialog.wide.zn-modal{width:min(1280px,calc(100vw - 24px));max-width:none}
.zn-ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--sp-4);align-items:start;margin:var(--sp-3) 0}
@media (max-width:900px){ .zn-ed,.zn-fill{grid-template-columns:1fr!important} }
.zn-nav{position:sticky;top:0;z-index:4;background:var(--line);padding-bottom:6px;display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)}.zn-nav #zn-acro{margin-left:auto}
.zn-left{max-height:72vh;overflow:auto;background:var(--line);border-radius:10px;padding:var(--sp-3)}
.zn-page{position:relative;container-type:inline-size;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);width:100%;line-height:1.15;font-family:Arial,Helvetica,sans-serif}
.zn-page img{position:absolute;inset:0;width:100%;height:100%;user-select:none;pointer-events:none}
.zn-page.edit{cursor:crosshair;touch-action:none}
.zn-z{position:absolute;box-sizing:border-box;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:2px;overflow:hidden;white-space:nowrap;color:#0a144d;display:flex;align-items:center;padding:0 .2em}
.zn-z.long{white-space:pre-wrap;align-items:flex-start;overflow-wrap:anywhere}.zn-z.case{justify-content:center;padding:0;font-weight:700}
.zn-page.edit .zn-z{cursor:move;font-size:11px!important;color:var(--navy);font-weight:600}.zn-page.edit .zn-z span{pointer-events:none;overflow:hidden;text-overflow:ellipsis}
.zn-z.sel{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 16%,transparent);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--navy);z-index:2}
.zn-h{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;background:var(--navy);cursor:nwse-resize;border-radius:3px 0 2px 0;display:none}.zn-z.sel .zn-h{display:block}
.zn-ghost{pointer-events:none;border-style:dashed}
.zn-z.fill{border:1px dashed transparent;background:transparent;cursor:text}.zn-z.fill:hover,.zn-z.fill.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.zn-rot{position:absolute;left:8px;top:8px;margin:0;padding:4px 8px;background:var(--warn-bg);color:var(--warn);border-radius:6px;font-size:12px;z-index:3}
.zn-side{display:flex;flex-direction:column;gap:var(--sp-3)}.zn-side h4{margin:0}
.zn-card{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-3);border:1px solid var(--navy);border-radius:10px;background:var(--surface)}
.zn-list{margin:0;padding-left:1.3em;max-height:26vh;overflow:auto;display:flex;flex-direction:column;gap:2px}.zn-list small{margin-left:6px;color:var(--text-3)}.zn-list .on{font-weight:800}
.zn-fill{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:var(--sp-4);align-items:start}
.zn-form{display:flex;flex-direction:column;gap:var(--sp-3);position:sticky;top:var(--sp-3);max-height:calc(100vh - 40px);overflow:auto}
.zn-form .field.bad .in{border-color:var(--warn);background:var(--warn-bg)}
.zn-ck{display:flex;gap:8px;align-items:center;font-weight:600}.zn-ck input{width:20px;height:20px}
.zn-prev{display:flex;flex-direction:column;gap:var(--sp-3);background:var(--line);border-radius:10px;padding:var(--sp-3)}
.pm-w{display:block;margin-top:3px;padding-left:14px;border-left:3px solid var(--accent);font-size:var(--fs-2)}
.pm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-2)}
.pm-list li{padding:var(--sp-3);border:1px solid var(--accent-line);border-left:4px solid var(--accent);border-radius:10px;background:var(--accent-soft)}
.pm-list li small{margin-left:8px;color:var(--text-3)}.pm-list li span{display:block;font-size:var(--fs-2);margin-top:3px}
.cg-pent{margin:0;padding:var(--sp-3);border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:var(--fs-2)}
.mt{display:flex;flex-direction:column;gap:6px}
.mt-row{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:8px;align-items:center}
.mt-row .num{text-align:right;font-variant-numeric:tabular-nums}
.mt-km{display:grid;grid-template-columns:minmax(0,1fr) 90px 150px auto auto;gap:8px;align-items:center;margin-top:var(--sp-2);padding:var(--sp-3);border:1px dashed var(--line-strong);border-radius:10px;background:var(--bg)}
.mt-km>b,.mt-km>small{grid-column:1/-1}.mt-km>small{color:var(--text-3)}.mt-el{display:flex;gap:5px;align-items:center;white-space:nowrap}
@media (max-width:800px){ .mt-km{grid-template-columns:1fr 1fr} }
.mt-tot{display:flex;justify-content:flex-end;gap:var(--sp-3);align-items:baseline;padding-top:6px;border-top:2px solid var(--navy);color:var(--navy);font-weight:700}
.mt-tot b{font-size:var(--fs-5);font-variant-numeric:tabular-nums;min-width:120px;text-align:right;margin-right:18px}
.news{list-style:none;margin:0 0 var(--sp-4);padding:0;display:flex;flex-direction:column;gap:6px}
.news li{display:flex;align-items:center;gap:var(--sp-3);padding:8px var(--sp-3);border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.news li a{font-weight:700;color:var(--navy);text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news li a:hover{text-decoration:underline}
.news li small{color:var(--text-3);margin-left:auto;white-space:nowrap}
.news .badge{flex:none;margin:0}
.newsfold{margin:0 0 var(--sp-4);background:var(--accent-soft);border-radius:10px;padding:0 var(--sp-3)}
.newsfold summary{display:flex;align-items:center;gap:var(--sp-3);min-height:48px;cursor:pointer;list-style:none;color:var(--accent-ink)}
.newsfold summary::-webkit-details-marker{display:none}
.newsfold .nf-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newsfold .nf-go{font-weight:700;color:var(--accent-text)}.newsfold[open] .nf-go{display:none}
.newsfold[open]{padding-bottom:var(--sp-3)}.newsfold .news{margin-bottom:var(--sp-2)}
.newshead{display:flex;align-items:center;gap:var(--sp-3)}.newshead .linkbtn{margin-left:auto}
.btnlink{display:inline-flex;align-items:center;text-decoration:none;border-radius:var(--r-sm);padding:6px 12px;font-weight:600}
.installbtn{border-color:var(--accent)!important}
.installbtn svg{width:16px;height:16px;flex:none}
.sidever{margin:6px 0 0;text-align:center;font-size:10.5px;line-height:1.2;color:var(--text-on-dark-2);opacity:.85}
html.menu-clair .sidever{color:var(--menu-muted)}
/* La recherche (accueil, catégories, annuaire) et l'en-tête de l'administration restent en haut quand on descend */
body{--tb:color-mix(in srgb,var(--blue) 14%,#fff);--tbl:color-mix(in srgb,var(--blue) 35%,#fff)}
.bigsearch:has(> #q),.annu-tools,.stickhead{position:sticky;top:0;z-index:4;background:var(--tb);
  /* teinte prolongée sur toute la largeur par border-image (débordement « visuel » seulement : pas de barre de défilement horizontale) */
  border-image:linear-gradient(to top,var(--tbl) 1px,var(--tb) 1px) fill 0/0/0 100vmax}
/* en haut de page, la teinte remonte jusqu'au bord de la fenêtre (plus de liseré clair au-dessus) */
.panel>.stickhead:first-child,.panel>.bigsearch:first-child,#p-annu>.stickhead:first-child{border-image-outset:30px 100vmax 0}
/* accueil : la ligne « Bonsoir » est dans la même teinte, jusqu'à la barre de recherche */
.todayrow{border-bottom:0!important;border-image:linear-gradient(var(--tb),var(--tb)) fill 0/0/30px 100vmax 48px 100vmax}
@media (max-width:900px){ .panel>.stickhead:first-child,.panel>.bigsearch:first-child{border-image-outset:20px 100vmax 0} .todayrow{border-image-outset:20px 100vmax 48px 100vmax} }
.annu-tools,.stickhead{position:sticky}
.bigsearch:has(> #q){padding:var(--sp-3) 0;margin-top:calc(-1 * var(--sp-3))}
.annu-tools{padding-top:var(--sp-3);padding-bottom:var(--sp-3)}
.stickhead{padding:var(--sp-3) 0;margin:calc(-1 * var(--sp-3)) 0 var(--sp-4)}
.stickhead h2.sec{margin-top:0}
.stickhead .annu-tools{position:static;border-image:none;background:none;margin-bottom:0}
.stickhead .listhead{margin-top:0}
.annu-desc{margin-top:calc(-1 * var(--sp-2))}
.stickhead .row{margin:0}

/* Cartes
   .card        bloc de formulaire ou de réglages ; .card.top : liseré coloré en haut (.blue)
   .fcard       carte cliquable (formulaires, kits, épinglés) ; .fcard.new : « + Nouveau »
   .quick       raccourci de tâche de l'accueil
   .gcard       document en vue Vignettes                                        */
.card{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:var(--sp-4);display:grid;gap:var(--sp-3)}
.card.top{border-top:4px solid var(--navy)}
.card.top.blue{border-top-color:var(--blue)}
.card.addcard{box-shadow:none}
.card h3{margin:0;font-weight:700;font-size:var(--fs-5);color:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--sp-4)}
.cards.narrow{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
#p-docs .cards{margin-bottom:var(--sp-6)}
.fcard{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:var(--sp-4);display:grid;gap:var(--sp-2);text-align:left}
.fcard:hover{border-color:var(--line-strong)}
.fcard b{font-weight:700;font-size:var(--fs-5);line-height:1.25;color:var(--navy)}
.fcard span{color:var(--text-3);font-size:var(--fs-3)}
.fcard.new{border-style:dashed;place-items:center;min-height:120px}
.fcard.tile{padding:var(--sp-3) var(--sp-4);gap:6px}
#p-forms .cards .fcard{border-top:4px solid var(--accent);grid-template-columns:auto 1fr;column-gap:var(--sp-3);align-items:start}
#p-forms .cards .fcard b,#p-forms .cards .fcard span:not(.femoji){grid-column:2}
#p-forms .cards .fcard .femoji{grid-row:1/3;font-size:30px;line-height:1.1;color:inherit}
.temoji{margin-right:10px}
.ico.emoji{background:var(--accent-soft);font-size:20px;color:inherit}
.tthumb{width:100%;height:96px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:var(--sp-1)}
.quickrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--sp-4);margin:var(--sp-1) 0 var(--sp-5)}
.quick{display:flex;align-items:center;gap:var(--sp-3);text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:var(--sp-4);color:var(--navy);transition:transform .12s,box-shadow .12s}
.quick:hover{transform:translateY(-2px);box-shadow:var(--shadow-raised)}
.quick .qi{flex:none;width:44px;height:44px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.quick .qi{font-size:24px}
.quick .qt{display:grid;gap:2px}
.quick b{font-size:var(--fs-4);font-weight:700}
.quick .qt span{font-size:var(--fs-2);color:var(--text-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--sp-4)}
.gcard{display:flex;flex-direction:column;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);overflow:hidden}
.gcard:hover{border-color:var(--line-strong)}
.gcard.droptarget{outline:3px solid var(--accent-line)}
.gthumb{position:relative;display:block;aspect-ratio:3/4;background:var(--surface-2);border-bottom:1px solid var(--line);overflow:hidden}
.gthumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.gthumb .gext{position:absolute;left:var(--sp-2);bottom:var(--sp-2);background:color-mix(in srgb,var(--text) 86%,transparent);color:var(--on-color);font-weight:700;font-size:var(--fs-micro);padding:2px 6px;border-radius:var(--r-sm)}
.gthumb.noimg,.gthumb:not(:has(img)){display:grid;place-items:center}
.gthumb:not(:has(img)) .gext,.gthumb.noimg .gext{position:static;font-size:var(--fs-5);padding:var(--sp-2) var(--sp-3)}
.gbody{padding:10px var(--sp-3) 6px;display:grid;gap:var(--sp-1);flex:1}
.gbody b{font-size:var(--fs-4);line-height:1.3;color:var(--navy)}
.gbody small{color:var(--text-3);font-size:var(--fs-1)}
.gact{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap;align-items:center}
.gact .iconbtn{width:36px;height:36px}

/* Tableaux */
.tablebox{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);overflow-x:auto}
.tablebox.mt-m{margin-top:var(--sp-4)}
table.docs{width:100%;border-collapse:collapse;font-size:var(--fs-3)}
/* tableau trop large pour la fenêtre (zoom fort) : il défile dans son cadre, la page ne s'élargit pas */
.tblwrap{overflow-x:auto;max-width:100%}
table.docs th{background:var(--surface-3);color:var(--text-3);text-align:left;font-size:var(--fs-1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px var(--sp-4);white-space:nowrap;border-bottom:1px solid var(--line)}
table.docs th.right{text-align:right}
table.docs th button{all:unset;cursor:pointer}
table.docs th button:focus-visible{outline:3px solid var(--focus)}
.col-icon{width:46px} .col-actions{width:56px} .col-qty{width:190px}
table.docs td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.docs tr:last-child td{border-bottom:0}
table.docs tr:hover td{background:var(--surface-3)}
table.docs .t a{font-size:var(--fs-4);font-weight:700;line-height:1.3;color:var(--navy);text-decoration:none}
table.docs .t a:hover{text-decoration:underline}
table.docs .t small{display:block;color:var(--text-3);font-size:var(--fs-2);margin-top:2px}
table.docs .t .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:640px;margin-top:var(--sp-1);color:var(--text-2);font-size:var(--fs-3);line-height:1.45}
table.docs .num{white-space:nowrap;color:var(--text-3);font-weight:500;font-size:var(--fs-3)}
table.docs .act{display:flex;gap:2px;justify-content:flex-end;align-items:center;flex-wrap:nowrap;white-space:nowrap}
table.docs .act .primary{margin-right:6px}
.empty{padding:var(--sp-4);color:var(--text-muted)}

/* Pictogramme de type de fichier, miniature */
.ico{display:inline-grid;place-items:center;width:32px;height:38px;border-radius:var(--r-sm);font-size:var(--fs-micro);font-weight:700;color:var(--on-color);background:var(--text-muted)}
.ico.pdf{background:var(--danger)} .ico.doc{background:var(--blue)} .ico.xls{background:var(--ok)}
.ico.img,.ico.accent{background:var(--accent);color:var(--text)}
.ico.navy{background:var(--navy)}
img.thumb{display:block;width:40px;height:54px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}

/* Badges : .badge (neutre : version, mot-clé) ; .badge.accent (« Modèle à remplir », « Formulaire ») */
.badge{display:inline-block;border-radius:var(--r-full);background:var(--surface-2);color:var(--text-3);font-size:var(--fs-1);font-weight:600;line-height:1.5;padding:1px var(--sp-2);vertical-align:2px}
.badge+.badge{margin-left:var(--sp-1)}
.badge.accent{background:var(--accent-soft);color:var(--accent-text);font-weight:700;margin-left:6px}
table.docs .t .badge:not(.accent){margin:var(--sp-1) var(--sp-1) 0 0}
.gbody .badge{justify-self:start}

/* Messages : .notice (encadré), .errors (liste d'erreurs), .privacy (rappel « rien n'est enregistré »), .toast */
.notice{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);border-radius:var(--r-md);padding:10px var(--sp-3);font-size:var(--fs-3)}
.notice b{font-weight:700}
.nm-warn{display:block;margin-top:var(--sp-1);color:var(--warn);font-weight:600}
.badch{font-size:1.15em;padding:0 .15em;background:var(--warn-bg);border-radius:4px}
.fielderr,.dialog .fielderr{margin:calc(-1 * var(--sp-1)) 0 var(--sp-2);color:var(--danger);font-size:var(--fs-3);font-weight:600}
.errors{margin:0;padding:10px var(--sp-3) 10px 30px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);border-radius:var(--r-md);font-size:var(--fs-3);display:grid;gap:var(--sp-1)}
.errors:focus{outline:3px solid var(--focus,var(--navy));outline-offset:2px}
/* message d'erreur cliquable : il mène au champ */
.errgo{border:0;background:none;padding:2px 0;color:inherit;font:inherit;font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.errgo:hover{text-decoration-thickness:2px}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-3);font-weight:700;color:var(--ok-text)}
.privacy svg{width:20px;height:20px;flex:0 0 auto;margin-top:1px}
.privacy .pemo{font-size:17px;line-height:1.2;flex:none}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);display:flex;align-items:center;gap:var(--sp-2);background:var(--navy);color:var(--on-color);border-radius:var(--r-md);padding:10px var(--sp-4);font-size:var(--fs-3);font-weight:700;box-shadow:var(--shadow-pop)}
.toast.ok::before,.toast.err::before{content:"";flex:none;width:8px;height:8px;border-radius:50%}
.toast.ok::before{background:var(--ok-on-dark)}
.toast.err{background:var(--danger)}
.toast.err::before{background:var(--on-color)}

/* Fenêtres, menu contextuel */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:var(--sp-4)}
.dialog{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:20px;display:grid;gap:var(--sp-3);line-height:1.5}
.dialog.wide{max-width:760px}
.dialog.send{max-width:560px}
.dialog h3{margin:0;font-weight:700;font-size:var(--fs-5);color:var(--navy);text-wrap:balance}
.dialog p{margin:0;color:var(--text-muted);font-size:var(--fs-3)}
.dialog .btns{display:grid;gap:10px}
.menu{position:absolute;z-index:25;display:grid;min-width:280px;padding:var(--sp-1);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-pop)}
.menu button{display:flex;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:10px var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-3);font-weight:600;color:var(--text)}
.menu button:hover{background:var(--warn-bg)}
/* élément du menu atteint au clavier : contour de 3 px à l'intérieur (le menu rogne ses bords), le fond reste celui du survol */
.menu button:focus{outline:none}
.menu button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.menu svg{width:18px;height:18px;flex:0 0 auto}
#emltip{position:fixed;right:20px;bottom:20px;z-index:30;max-width:420px;display:grid;gap:var(--sp-2);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-md);padding:14px var(--sp-4);box-shadow:var(--shadow-pop);font-size:var(--fs-3)}
#emltip b:first-child{color:var(--navy);font-size:var(--fs-4)}
#emltip ol{margin:0;padding-left:20px;display:grid;gap:var(--sp-1)}
#emltip span{color:var(--text-3)}
#emltip .primary,#emltip .secondary{min-height:34px;padding:0 14px;font-size:var(--fs-3)}

/* Dépôt de fichiers */
.dropzone{display:grid;gap:var(--sp-1);justify-items:center;padding:22px 14px;text-align:center;border:2px dashed var(--line-dashed);border-radius:var(--r-md);background:var(--surface-3);color:var(--text);cursor:pointer}
.dropzone svg{width:32px;height:32px}
.dropzone b{font-size:var(--fs-4)}
.dropzone span{color:var(--text-muted);font-size:var(--fs-3)}
.dropzone.over{background:var(--warn-bg);border-color:var(--accent-line)}
#dropveil{display:none}
body.dragging #dropveil{display:grid;position:fixed;inset:0;z-index:15;pointer-events:none;place-items:end center;padding-bottom:var(--sp-7);background:color-mix(in srgb,var(--accent) 14%,transparent);outline:4px dashed var(--accent);outline-offset:-10px}
#dropveil div{background:var(--accent);color:var(--text);border-radius:var(--r-md);padding:var(--sp-3) 18px;font-weight:700;font-size:var(--fs-4);box-shadow:var(--shadow-raised)}
.droptarget,.droptarget td{outline:3px solid var(--accent-line)!important;background:var(--accent-soft)!important}

/* Barre du mode admin */
#formadmin{margin-bottom:var(--sp-4)}
.card.flash{outline:3px solid var(--accent-line);outline-offset:3px;transition:outline-color .6s}
.adminbar{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;background:var(--accent-soft);color:var(--text);border:1px solid var(--warn-line);border-radius:var(--r-md);padding:var(--sp-2) 10px}
.adminbar b{font-weight:700;font-size:var(--fs-3);color:var(--warn)}
.adminbar .dropnote{margin-right:auto;display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:var(--fs-3)}
.adminbar .dropnote svg{width:18px;height:18px}
.adminbar .secondary{min-height:34px;padding:0 11px}

/* Fenêtre d'envoi : étapes et fichiers */
.step{display:grid;gap:10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-3);padding:var(--sp-3)}
.step .sh{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text)}
.step .num{width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--text);color:var(--on-color);font-size:var(--fs-3)}
.step.done .num{background:var(--ok)}
.step p{color:var(--text)}
.files{display:grid;gap:6px}
.files a{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-3);color:var(--text);text-decoration:none;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:var(--sp-2) 10px;background:var(--surface)}
.files a svg{width:18px;height:18px;color:var(--danger);flex:0 0 auto}
.files a span{flex:1;min-width:0;overflow-wrap:anywhere}
.files a small{color:var(--blue);font-weight:700}
.addr,code.path{display:block;font-family:inherit;font-size:var(--fs-2);background:var(--surface-3);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px var(--sp-2);overflow-wrap:anywhere;color:var(--text)}
.destline{display:flex;align-items:flex-start;gap:var(--sp-2);margin-top:var(--sp-2);font-size:var(--fs-2);color:var(--text-3);background:var(--surface-2);border-radius:var(--r-sm);padding:var(--sp-2) 10px}
.destline svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px;color:var(--blue)}
.destline code{font-family:inherit;font-weight:700;color:var(--navy);word-break:break-all}
.fromline{gap:10px;margin-top:var(--sp-2);font-weight:600;color:var(--navy);font-size:var(--fs-3)}
.fromline select{width:auto;min-width:240px;height:var(--h-control)}

/* Choix des destinataires d'un mail */
.recip{display:grid;gap:10px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;background:var(--surface-3)}
.recip-sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;max-height:118px;overflow:auto;padding-right:var(--sp-1)}
.rchip{display:inline-flex;align-items:center;gap:var(--sp-1);background:var(--navy);color:var(--on-color);border-radius:var(--r-full);padding:var(--sp-1) 6px var(--sp-1) var(--sp-3);font-size:var(--fs-3);font-weight:600}
.rchip button{border:0;background:rgba(255,255,255,.18);color:var(--on-color);width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1}
.recip-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:var(--sp-2)}
.recip-list{display:grid;gap:var(--sp-1);max-height:260px;overflow:auto}
.recip-list:empty{display:none}
.recip-head{padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.recip-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--sp-2);align-items:center;padding:5px 2px;border-bottom:1px solid var(--line-soft)}
.recip-row .rname{font-weight:600;font-size:var(--fs-3)}
.recip-row small{color:var(--text-3);font-weight:500}
.rmails{display:flex;flex-wrap:wrap;gap:var(--sp-1)}
.recip-selbox{border-top:1px solid var(--line);padding-top:var(--sp-2);display:grid;gap:6px}
.recip-count{font-size:var(--fs-3);color:var(--navy)}
.recip-count:empty{display:none}
@media (max-width:700px){ .recip-add,.recip-row{grid-template-columns:1fr} }

/* ---------- 5. Écrans ---------- */

/* Formulaires (délivrance, relais, formulaires de l'admin) */
.dates{display:grid;gap:10px}
.daterow{display:grid;grid-template-columns:1fr 140px 44px;gap:var(--sp-2);align-items:end}
.daterow .wd{font-size:var(--fs-1);color:var(--text-muted);min-height:16px;text-transform:none;letter-spacing:0;font-weight:400}
.daterow .lettres{grid-column:1/-1;margin-top:-2px;font-size:var(--fs-2);color:var(--text);font-style:italic}
.daterow .lettres:empty{display:none}
.dose{position:relative}
.dose input{padding-right:36px}
.dose em{position:absolute;right:10px;bottom:14px;font-style:normal;font-size:var(--fs-3);color:var(--text-muted);pointer-events:none}
.dose-sm{max-width:160px}
.dosew{display:block;color:var(--blue);font-weight:600;margin-top:var(--sp-1)}
/* Miniature en direct du formulaire */
#livepv{position:fixed;z-index:6;right:20px;top:92px;width:clamp(190px,calc(100vw - var(--sbw) - var(--w-form) - 110px),300px);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-raised);padding:10px;display:grid;gap:8px}
#livepv[hidden],#livepv-tab[hidden]{display:none}
#livepv .lp-head{display:flex;align-items:center;gap:8px;font-size:var(--fs-2)}
#livepv .lp-pg{flex:1;color:var(--text-muted);font-size:var(--fs-1)}
#livepv .lp-x{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--text-muted);padding:2px 6px;border-radius:6px}
#livepv .lp-x:hover{background:var(--surface-2);color:var(--navy)}
#livepv .lp-page{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:zoom-in;overflow:hidden;aspect-ratio:210/297;position:relative}
#livepv .lp-page:hover{border-color:var(--accent-line)}
#livepv canvas{display:block;width:100%;height:auto}
#livepv canvas[hidden]{display:none}
#livepv .lp-wait{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;font-size:var(--fs-2);color:var(--text-muted)}
#livepv .lp-wait[hidden]{display:none}
#livepv .lp-note{margin:0;font-size:var(--fs-1);color:var(--text-muted);line-height:1.35}
#livepv-tab{position:fixed;z-index:6;right:20px;bottom:20px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--navy);border-radius:var(--r-full);padding:8px 14px;font:inherit;font-size:var(--fs-2);font-weight:600;cursor:pointer;box-shadow:var(--shadow-raised)}
#livepv-tab svg{width:16px;height:16px}
/* fenêtre étroite : la miniature se range en bas à droite, plus petite */
@media (max-width:1460px){ #livepv{width:250px} #livepv .lp-note{display:none} html.live-on .content{padding-right:290px} }
/* fenêtre étroite ou zoom fort : l'aperçu ouvert à la demande passe par-dessus le formulaire et défile */
@media (max-width:1000px){
  #livepv,#livepv.big{top:auto;bottom:12px;right:12px;width:min(300px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;z-index:7}
  #livepv-tab{right:12px;bottom:12px}
  #livepv-tab.inflow{position:static;justify-self:start;box-shadow:none}
}
/* Aperçu agrandi : lisible à 1366 px, par-dessus le formulaire ; « Réduire » le range */
#livepv .lp-big{border:1px solid var(--line-strong);background:var(--surface);color:var(--navy);font:inherit;font-size:var(--fs-2);font-weight:700;border-radius:999px;padding:3px 10px;cursor:pointer}
#livepv .lp-big:hover{border-color:var(--accent-line)}
#livepv .lp-head .lp-big+.lp-big{margin-left:4px}
.dialog.pgzoom{width:min(1040px,calc(100vw - 32px));max-width:none;max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:var(--sp-3)}
.db-sg{list-style:none;margin:0 0 var(--sp-3);padding:0;display:flex;flex-direction:column;gap:var(--sp-2)}
.db-sg li{display:flex;gap:var(--sp-3);align-items:flex-start;justify-content:space-between;padding:var(--sp-3);border:1px solid var(--accent-line);border-left:4px solid var(--accent);border-radius:10px;background:var(--accent-soft)}
.db-sg li>div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}.db-sg li .badge{align-self:flex-start}
.db-sga{display:flex;gap:var(--sp-2);align-items:center;flex-shrink:0}
.pgzoom .pz-head{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}.pgzoom .pz-head h3{margin-right:auto}
.pgzoom .pz-pages{overflow:auto;background:var(--line);border-radius:8px;padding:var(--sp-3);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);min-height:200px}
.pgzoom .pz-pages canvas{width:100%;max-width:960px;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);animation:lj-in .25s ease-out}
#livepv.big{width:min(640px,calc(100vw - var(--sbw) - 48px));top:16px;max-height:calc(100vh - 32px);overflow:auto;z-index:7}
#livepv .lp-txt{font-size:var(--fs-2)}
#livepv .lp-txt summary{cursor:pointer;color:var(--navy);font-weight:700}
#livepv .lp-tx{max-height:220px;overflow:auto;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
#livepv .lp-tx p{margin:0 0 4px}
#livepv.big .lp-tx{max-height:none}
@media print{ #livepv,#livepv-tab{display:none!important} }
/* Annuaire : contacts, import, doublons, export */
.listhead .row{gap:8px;flex-wrap:wrap}
.an-exp{margin-left:0}
.an-exp summary{padding:0 16px;min-height:42px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:700;color:var(--navy)}
.an-exp summary svg{width:17px;height:17px}
.an-exp .ab-menu small{display:block;color:var(--text-muted);font-size:var(--fs-1)}
.an-exp .ab-menu .hint{margin:6px 10px 2px;font-size:var(--fs-1)}
.warnbtn{border-color:var(--accent-line)!important}
.an-pers{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:var(--fs-2)}
.an-pers i{font-style:normal;color:var(--text-muted)}
.an-note{margin-top:4px;font-size:var(--fs-2);color:var(--text-muted);white-space:pre-line}
.mailline small{color:var(--text-muted);font-size:var(--fs-1);margin:0 4px}
.pp-row{display:grid;grid-template-columns:1.2fr 1fr 1.4fr 1fr 36px;gap:6px;margin-bottom:6px}
.pp-row .in{min-height:40px;padding:6px 10px}
.pa-dup{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-bg);border:1px solid var(--accent-line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:10px;font-size:var(--fs-3)}
.pa-dup[hidden]{display:none}
.im-help{margin-top:12px;font-size:var(--fs-3)}
.im-help summary{cursor:pointer;font-weight:700;color:var(--navy)}
.im-help li{margin:6px 0}
.im-tools{display:flex;gap:12px;align-items:end;justify-content:space-between;margin:10px 0}
.im-tools .field{flex:1;max-width:420px}
.im-list{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.im-row{display:grid;grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.im-row:last-child{border-bottom:0}
.im-row.off{opacity:.5}
.im-main small{display:block;color:var(--text-muted);font-size:var(--fs-1)}
.im-mail{font-size:var(--fs-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-st{font-size:var(--fs-1);font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.im-st.new{background:var(--accent-soft);color:var(--navy)}
.im-st.up{background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--navy)}
.im-st.same{background:var(--surface-3);color:var(--text-muted)}
.im-st.warn{background:var(--warn-bg);color:var(--warn)}
.dp-list{display:grid;gap:12px;max-height:60vh;overflow:auto}
.dp-row{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:8px}
.dp-why{font-size:var(--fs-2);font-weight:700;color:var(--text-muted)}
.dp-why.fort{color:var(--warn)}
.dp-pair{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;align-items:center}
.dp-card{display:grid;gap:2px;font-size:var(--fs-2);background:var(--surface-3);border-radius:8px;padding:8px 10px}
.dp-card small{color:var(--text-muted)}
/* Cerfa pré-remplis */
.cz-warn{background:var(--warn-bg);border:1px solid var(--accent-line);border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-3);display:flex;gap:12px;align-items:center;justify-content:space-between}
.cz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--sp-4);max-width:var(--w-form)}
.cz-list{margin:0;padding-left:20px;display:grid;gap:6px}
.cz-note{margin:8px 0 0;white-space:pre-line;font-size:var(--fs-3)}
.cz-h{margin:18px 0 6px;color:var(--navy)}
.dialog.cmpdlg{width:min(1200px,96vw);max-width:none}
.cmp-slots{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.cmp-slot{display:grid;gap:var(--sp-1)}
.cmp-slot .dropzone{padding:14px 10px}
.cmp-slot.filled .dropzone{border-style:solid;border-color:var(--accent-line)}
.cmp-drop.over{background:var(--surface-2)}
.cmp-head{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-3)}
.cmp-meta{display:grid;gap:2px;padding:8px 10px;border-radius:var(--r-md);background:var(--surface-3)}
.cmp-meta small{color:var(--text-2)}
.cmp-sum{margin:10px 0}
.cmp-grid{display:grid;gap:3px;max-height:52vh;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:var(--r-md);font-size:var(--fs-3);line-height:1.45}
.cmp-r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-c{padding:3px 8px;border:2px solid transparent;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmp-r.chg .cmp-c,.cmp-r.del .cmp-c:first-child,.cmp-r.add .cmp-c:last-child{border-color:var(--warn);background:var(--warn-bg)}
.cmp-c.cmp-empty{border:2px dashed var(--warn-line)!important;background:transparent!important}
.cmp-p{float:right;margin-left:6px;font-size:var(--fs-1);color:var(--text-3)}
mark.cmp-out{background:var(--danger-bg);color:var(--danger-text);text-decoration:line-through;border-radius:3px;padding:0 2px}
mark.cmp-in{background:var(--ok-bg);color:var(--ok-text);border-radius:3px;padding:0 2px}
.cmp-gap{text-align:center;font-size:var(--fs-1);color:var(--text-3);padding:2px}
.cmp-keep .row{flex-wrap:wrap}
.cmp-keep{display:grid;gap:8px;margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--line)}
@media (max-width:760px){.cmp-slots,.cmp-head{grid-template-columns:1fr}}
.row.wrap{flex-wrap:wrap}
.ad-modif{display:grid;gap:6px;padding:10px 12px;border:2px dashed var(--line-dashed);border-radius:var(--r-md);background:var(--surface-3)}
.ad-modif p{margin:0}
.tp-opts{display:grid;gap:4px;margin:6px 0}
details.tp summary{cursor:pointer;font-weight:600}
.cmpv-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 6px}
.cmpv-top .cmp-sum{margin:0;font-size:var(--fs-4)}
.cmpv-chips{display:flex;flex-wrap:wrap;gap:6px}
.cmpv-chip{padding:3px 10px;border-radius:var(--r-full);font-size:var(--fs-2);font-weight:600;border:1.5px solid}
.cmpv-chip.k-chg,.cmpv-item.k-chg .cmpv-n{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.cmpv-chip.k-add,.cmpv-item.k-add .cmpv-n{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-text)}
.cmpv-chip.k-del,.cmpv-item.k-del .cmpv-n{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-text)}
.cmpv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmpv-scroll{height:60vh;overflow:auto;padding:14px 12px 14px 30px;border-radius:var(--r-md);background:var(--surface-2);--pgw:72%}
.cmpv-scroll>*{width:var(--pgw);margin:0 auto 14px}
.cmpv-scroll>.hint{width:auto}
.cmpv-pg{position:relative;background:var(--surface);box-shadow:var(--shadow-sheet);border-radius:2px}
.cmpv-pg img{display:block;width:100%;height:auto}
.cmpv-hl{position:absolute;border-radius:3px;cursor:pointer;mix-blend-mode:multiply;outline:2px solid;outline-offset:1px}
.cmpv-hl.k-chg{background:color-mix(in srgb,var(--warn) 30%,transparent);outline-color:var(--warn)}
.cmpv-hl.k-add{background:color-mix(in srgb,var(--ok) 35%,transparent);outline-color:var(--ok)}
.cmpv-hl.k-del{background:color-mix(in srgb,var(--danger) 32%,transparent);outline-color:var(--danger)}
.cmpv-ins{position:absolute;height:0;border-top:3px dashed var(--danger);cursor:pointer}
.cmpv-n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:var(--r-full);font:700 var(--fs-1)/1 var(--f-body);background:var(--text);color:var(--on-color);border:1.5px solid var(--surface);box-shadow:var(--shadow-soft)}
.cmpv-hl>.cmpv-n,.cmpv-ins>.cmpv-n{position:absolute;left:-26px;top:50%;transform:translateY(-50%)}
.cmpv-pno{position:absolute;right:6px;bottom:4px;font-size:var(--fs-1);color:var(--text-muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:0 4px;border-radius:4px}
.cmpv-paper{position:relative;background:var(--surface);box-shadow:var(--shadow-sheet);border-radius:2px;padding:22px 26px 26px 34px;font-size:var(--fs-1);line-height:1.5;color:var(--text);min-height:280px}
.cmpv-ln{position:relative;padding:1px 4px;border-radius:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmpv-ln.k-chg{background:color-mix(in srgb,var(--warn) 26%,transparent);box-shadow:inset 0 0 0 1.5px var(--warn);cursor:pointer}
.cmpv-ln.k-add{background:color-mix(in srgb,var(--ok) 32%,transparent);box-shadow:inset 0 0 0 1.5px var(--ok);cursor:pointer}
.cmpv-ln.k-del{background:color-mix(in srgb,var(--danger) 28%,transparent);box-shadow:inset 0 0 0 1.5px var(--danger);cursor:pointer}
.cmpv-ln>.cmpv-n{position:absolute;left:-28px;top:0}
.cmpv-insl{position:relative;height:0;border-top:3px dashed var(--danger);margin:4px 0;cursor:pointer}
.cmpv-insl>.cmpv-n{position:absolute;left:-28px;top:-11px}
.cmpv-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:var(--fs-3)}
.cmpv-zoom{display:flex;gap:4px;align-items:center}
.cmp-slots.done .dropzone{padding:8px 10px;grid-template-columns:auto 1fr;justify-items:start;text-align:left}
.cmp-slots.done .dropzone svg{display:none}
.cmp-slots.done .dropzone b{font-size:.9375rem}
@keyframes cmpflash{0%,100%{box-shadow:0 0 0 0 transparent}40%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 75%,transparent)}}
.flash{animation:cmpflash .9s ease 2}
.cmpv-sum{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-3)}
.cmpv-sum h4{margin:0 0 8px}
.cmpv-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:34vh;overflow:auto}
.cmpv-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);cursor:pointer;font:inherit;color:inherit}
.cmpv-item:hover{border-color:var(--accent-line)}
.cmpv-item .cmpv-n{border:1.5px solid;box-shadow:none;flex:none;margin-top:2px}
.cmpv-it{display:grid;gap:3px;min-width:0}
.cmpv-it small{color:var(--text-3)}
.cmpv-ex{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:var(--fs-3)}
.cmpv-ex>span{overflow-wrap:anywhere}
.cmpv-arrow{color:var(--text-3);font-weight:700}
.cmpv-detail{margin-top:10px}
.cmpv-detail summary{cursor:pointer;font-weight:600}
.cmpv-ocr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0 12px}
.ocr-bar{flex:1 1 200px;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.ocr-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
/* mouvement réduit : pas de pulsation, un contour fixe pendant 3 secondes marque l'endroit atteint */
@media (prefers-reduced-motion:reduce){.flash{outline:3px solid var(--accent-line);outline-offset:3px}}
.ad-scan{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-md);background:var(--accent-soft);font-size:var(--fs-3)}
.jr-tools,.ar-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jr-tools .in[type=search],.ar-tools .in[type=search]{flex:1 1 220px}
.jr-tools select{flex:0 1 200px}
.jr-list,.ar-list{display:grid;gap:4px;max-height:60vh;overflow:auto;margin-top:6px}
.jr-day{position:sticky;top:0;z-index:1;background:var(--surface);padding:8px 2px 4px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line)}
.jr-day::first-letter{text-transform:uppercase}
.jr-row,.ar-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:var(--r-md)}
.jr-row:hover,.ar-row:hover{background:var(--surface-3)}
.jr-ic,.ar-ic{font-size:20px}
.jr-t,.ar-t{display:grid;gap:1px;min-width:0}
.jr-t small,.ar-t small,.jr-m small{color:var(--text-3)}
.ar-f{font-family:ui-monospace,monospace;font-size:var(--fs-1);overflow-wrap:anywhere}
.jr-m{display:grid;text-align:right;font-size:var(--fs-3)}
.ar-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ar-act a.secondary{text-decoration:none}
.srch-txt{margin:-4px 0 10px 4px;font-size:var(--fs-3)}
.srch-txt small{font-size:var(--fs-1);font-weight:400;color:var(--text-muted)}
.txhit{font-style:italic}
.db-h{margin:6px 0 8px}
.db-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.db-card{display:grid;gap:2px;align-content:start;padding:12px;border-radius:var(--r-md);background:var(--surface-3);border:1.5px solid transparent}
.db-card.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.db-card.ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--surface))}
.db-card>b{font-size:1.5rem;line-height:1.1;color:var(--navy)}
.db-card small{color:var(--text-3)}
.db-ic{font-size:20px}
.db-sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:18px}
.db-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0}
.db-kpis>div{display:grid;padding:10px;border-radius:var(--r-md);background:var(--surface-3);text-align:center}
.db-kpis b{font-size:var(--fs-7);color:var(--navy)}
.db-kpis span{font-size:var(--fs-2);color:var(--text-3)}
.db-trend{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:90px;align-items:end;margin:6px 0 14px}
.db-trend span{display:grid;grid-template-rows:1fr auto;height:100%;align-items:end;text-align:center}
.db-trend i{display:block;min-height:2px;border-radius:4px 4px 0 0;background:var(--accent-line)}
.db-trend small{font-size:var(--fs-1);color:var(--text-3)}
.db-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.db-grid section{padding:12px;border:1px solid var(--line);border-radius:var(--r-md)}
.db-grid h5{margin:0 0 8px;font-size:.9375rem}
.db-bars{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.db-bars li{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:8px;align-items:center;font-size:var(--fs-3)}
.db-bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-bw{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.db-bw i{display:block;height:100%;border-radius:99px;background:var(--navy)}
.db-listbox{margin-top:14px;padding:12px;border-radius:var(--r-md);background:var(--surface-3)}
.db-listbox ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px;max-height:40vh;overflow:auto}
.db-listbox small{color:var(--text-3)}
.db-how{margin-top:12px}
.bk-opt{cursor:pointer}
.bk-opt input{justify-self:start}
.dialog.dbdlg,.dialog.jrdlg,.dialog.ardlg{width:min(1100px,95vw);max-width:none}
.dialog.hsdlg{width:min(1000px,95vw);max-width:none}
.hs-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.hs-kpi>div{position:relative;display:grid;padding:12px 14px 16px;border-radius:var(--r-md);background:var(--surface-3);overflow:hidden}
.hs-kpi b{font-size:var(--fs-7);color:var(--navy)}
.hs-kpi span{font-size:var(--fs-3);color:var(--text-3)}
.hs-kpi i{position:absolute;left:0;bottom:0;height:6px;background:var(--ok)}
.hs-kpi .imp i{background:var(--warn)}
.hs-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.hs-list{display:grid;gap:8px}
.hs-ch{margin:12px 0 2px;color:var(--navy)}
.hs-c{padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);border-left:5px solid var(--line-strong);display:grid;gap:4px}
.hs-c.ok{border-left-color:var(--ok)}.hs-c.late{border-left-color:var(--warn)}.hs-c.none{border-left-color:var(--danger)}
.hs-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hs-n{font-size:var(--fs-4)}
.hs-t{margin:0}
.hp{padding:2px 9px;border-radius:var(--r-full);font-size:var(--fs-1);font-weight:700}
.hp.ok{background:var(--ok-bg);color:var(--ok-text)}.hp.late{background:var(--warn-bg);color:var(--warn)}.hp.none{background:var(--danger-bg);color:var(--danger-text)}.hp.imp{background:var(--text);color:var(--on-color)}
.hs-p{margin:2px 0;padding-left:4px;list-style:none;display:grid;gap:3px}
.hs-p li{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hs-p small{color:var(--text-3)}
.hs-act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hs-act select{max-width:420px}
.badge.rel-late{background:var(--danger-bg);color:var(--danger-text);border-color:color-mix(in srgb,var(--danger) 35%,var(--surface))}
.badge.rel-soon{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.badge.warn{background:var(--warn-bg);color:var(--warn);margin-left:6px;font-weight:700}
.ren-list{display:grid;gap:4px;max-height:50vh;overflow:auto;margin:8px 0;font-size:var(--fs-2)}
.ren-list>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ren-list .old{color:var(--text-3);text-decoration:line-through}
.wz-nom{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.wz-nom h3{margin:0 0 4px}
.nm-prev{padding:10px 12px;border-radius:var(--r-md);background:var(--surface-3);margin:6px 0}
.nm-prev ul{margin:4px 0 0;padding-left:18px}
.favbtn{border:0;background:transparent;font-size:20px;line-height:1;padding:2px 6px;cursor:pointer;color:var(--text-muted);vertical-align:middle}
.favbtn.on{color:var(--accent-text)}
.favbtn:hover{color:var(--accent-text)}
.badge.st-draft{background:var(--surface-2);color:var(--text-3)}
.dialog.czdlg{width:min(1120px,95vw);max-width:none}
.cz-map{display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:14px;margin-top:8px}
.cz-fields{max-height:62vh;overflow:auto;display:grid;gap:6px;align-content:start;padding-right:4px}
.cz-f{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:4px 10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.cz-f.on{border-color:var(--accent-line);background:var(--accent-soft)}
.cz-f .in{min-height:38px;padding:4px 8px}
.cz-f [data-fx]{grid-column:1/-1}
.cz-l{font-size:var(--fs-2);overflow:hidden;text-overflow:ellipsis}
.cz-l small{display:block;color:var(--text-muted);font-size:var(--fs-1)}
.cz-page{position:sticky;top:0;align-self:start;display:grid;gap:4px}
.cz-page canvas{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.cz-info{margin-top:14px}
.cz-info summary{cursor:pointer;font-weight:700;color:var(--navy)}
.cz-info summary small{font-weight:400;color:var(--text-muted)}
.cc-list{display:grid;gap:8px;margin-top:6px}
.cc-row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 12px}
.cc-row small{display:block;color:var(--text-muted)}
.cc-row.ok{border-left-color:var(--ok)}.cc-row.new{border-left-color:var(--accent-line);background:var(--warn-bg)}.cc-row.warn{border-left-color:var(--warn)}
#cu-wrap .btns,#cz-wrap>.row.between{position:sticky;bottom:-1px;background:var(--surface);padding:10px 0 4px;z-index:2}
.cu-sum{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.cu-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cu-pair figure{margin:0;display:grid;gap:4px}
.cu-pair figcaption{font-weight:700;color:var(--navy);font-size:var(--fs-3)}
.cu-pair canvas{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
/* Papier à en-tête : polices, couleurs, marge */
.pp-sec{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;margin-bottom:10px}
.pp-sec>summary{cursor:pointer;font-weight:700;color:var(--navy);padding:4px 0}
.pp-sec>summary small{font-weight:400;color:var(--text-muted)}
.pp-sec[open]>summary{margin-bottom:8px}
.pp-fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:10px}
.pp-font{display:grid;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--text)}
.pp-font small{color:var(--text-muted);font-size:var(--fs-1)}
.pp-font[aria-pressed=true]{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent-line) inset}
.pp-cols{gap:16px;margin:6px 0 10px;align-items:center}
.pp-col{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-3);font-weight:600}
.pp-col input{width:42px;height:32px;border:1px solid var(--line-strong);border-radius:6px;padding:2px;background:var(--surface)}
.pp-syntax code{background:var(--surface-3);border-radius:4px;padding:1px 5px;font-size:var(--fs-1)}
/* Assistant de démarrage */
html.wiz-on body{overflow:hidden}
#wiz{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:20px}
#wiz[hidden]{display:none}
.wz-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);width:min(1180px,100%);height:min(820px,100%);display:grid;grid-template-columns:230px minmax(0,1fr);overflow:hidden}
.wz-steps{background:var(--surface-3);padding:22px 12px;display:grid;align-content:start;gap:4px}
.wz-st{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:9px 10px;font:inherit;font-weight:600;color:var(--text-muted);text-align:left;cursor:pointer}
.wz-st span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-strong);font-size:var(--fs-2);flex:none}
.wz-st.cur{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-soft)}
.wz-st.cur span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wz-st.done{color:var(--navy)}.wz-st.done span{background:color-mix(in srgb,var(--blue) 12%,var(--surface));border-color:color-mix(in srgb,var(--blue) 40%,var(--surface));color:var(--navy)}
.wz-st:disabled{cursor:default;opacity:.7}
.wz-main{display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-height:0}
.wz-body{overflow:auto;padding:28px 34px}
.wz-body h2{margin:0 0 6px;color:var(--navy);font-size:1.6rem}
.wz-lead{color:var(--text-muted);margin:0 0 18px;max-width:70ch}
.wz-points{display:grid;gap:10px;padding-left:20px;max-width:64ch}
.wz-split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.wz-prev{margin:0;position:sticky;top:0;display:grid;gap:6px}
.wz-prev canvas{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow-card)}
.wz-logo{height:48px;border-radius:6px;border:1px solid var(--line)}
.wz-med,.wz-cat{display:grid;grid-template-columns:minmax(0,1fr) 200px 36px;gap:8px;margin-bottom:8px;max-width:640px}
.wz-cat{grid-template-columns:28px minmax(0,1fr) 36px;max-width:520px;align-items:center}
.wz-n{font-weight:700;color:var(--text-muted);text-align:center}
.wz-packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.wz-pack{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.wz-pack:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.wz-pack input{margin-top:3px;width:18px;height:18px;flex:none}
.wz-pack small{color:var(--text-muted)}.wz-pack .d{display:block;margin-top:2px;font-size:var(--fs-2)}
.wz-mailopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.wz-mo{display:grid;gap:4px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:14px;font:inherit;cursor:pointer;color:var(--text)}
.wz-mo small{color:var(--text-muted)}
.wz-mo[aria-pressed=true]{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent-line) inset}
.wz-recap{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px 16px;max-width:760px}
.wz-recap dt{font-weight:700;color:var(--navy)}.wz-recap dd{margin:0}
.wz-err{margin:0;padding:0 34px;color:var(--danger);font-weight:600;min-height:1.4em}
.wz-foot{display:flex;gap:10px;align-items:center;padding:14px 34px 20px;border-top:1px solid var(--line)}
.wz-foot .sp{flex:1}
.wz-howto{display:grid;gap:8px;padding-left:20px}
/* Liste de démarrage */
.inv-choix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.startlist{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px;margin-bottom:var(--sp-5);max-width:900px}
.sl-head{display:flex;align-items:center;gap:12px}.sl-head .hint{flex:1;margin:0}
.sl-bar{height:6px;border-radius:99px;background:var(--surface-3);margin:10px 0 6px;overflow:hidden}.sl-bar span{display:block;height:100%;background:var(--accent-line);border-radius:99px}
.startlist ul{list-style:none;margin:0;padding:0;display:grid}
.startlist li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.startlist li:last-child{border-bottom:0}
.sl-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:var(--fs-1);flex:none}
.startlist li.ok .sl-dot{background:var(--ok);border-color:var(--ok);color:var(--on-color)}.startlist li.ok .sl-t{color:var(--text-muted);text-decoration:line-through}
.sl-t{flex:1}
.catbtn .cemo{width:20px;text-align:center;font-size:15px;line-height:1;flex:none}
.hsec .he,.hrow .hi.lien{font-size:20px;line-height:1}
/* Réglages en sections */
.rsec-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:var(--sp-4)}
.rsec-b{display:grid;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:var(--text);cursor:pointer}
.rsec-b small{color:var(--text-muted);font-size:var(--fs-1)}
.rsec-b[aria-selected=true]{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent-line) inset}
.reglages[data-show] .card[data-rsec]{display:none}
.reglages[data-show=structure] .card[data-rsec=structure],.reglages[data-show=courriers] .card[data-rsec=courriers],.reglages[data-show=fichiers] .card[data-rsec=fichiers],.reglages[data-show=equipe] .card[data-rsec=equipe],.reglages[data-show=apparence] .card[data-rsec=apparence],.reglages[data-show=mail] .card[data-rsec=mail],.reglages[data-show=securite] .card[data-rsec=securite]{display:block}
.rsave{display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-2);flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.ap-adj{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:var(--fs-2);color:var(--text-muted)}
.ap-adj code{font-size:.95em}
.ap-dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px var(--line-strong)}
.rsave .rs-state{margin-right:auto;color:var(--text-muted);font-size:var(--fs-2)}
.rsave button:disabled{opacity:.55;cursor:default}
