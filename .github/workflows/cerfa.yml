# Met à jour cerfa/cerfa.json le 1er de chaque mois (et à la demande : Actions › Liste des Cerfa › Run workflow).
# Les outils GitHub sont figés par empreinte (SHA) : une version piégée publiée plus tard sous la même étiquette
# ne pourrait pas s'exécuter ici. Dependabot (.github/dependabot.yml) propose chaque mois les nouvelles versions.
# Cela ne touche pas aux données : la liste des Cerfa est relue chaque mois à la source (data.gouv.fr).
name: Liste des Cerfa
on:
  schedule: [{cron: '17 4 1 * *'}]
  workflow_dispatch: {}
permissions: {}
jobs:
  maj:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publier cerfa/cerfa.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - run: node maj-cerfa.mjs
        working-directory: cerfa
      - name: Publier si la liste a changé
        run: |
          git config user.name "robot-librejo"
          git config user.email "robot-librejo@users.noreply.github.com"
          git add cerfa/cerfa.json
          git diff --cached --quiet || git commit -m "Liste des Cerfa : mise à jour du $(date +%Y-%m-%d)"
          git push
